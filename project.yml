# Generate the Xcode project with:  xcodegen generate
name: TopoOffline
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
targets:
  TopoOffline:
    type: application
    platform: iOS
    sources:
      - path: TopoOffline
    info:
      path: TopoOffline/Info.plist
      properties:
        CFBundleDisplayName: Topo Offline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LINZAPIKey: $(LINZ_API_KEY)
        LINZKeyIsDeveloper: $(LINZ_KEY_IS_DEVELOPER)
        NSLocationWhenInUseUsageDescription: "Your location is shown on the map so you can see where you are, even without phone signal. While you record a trip or follow a route, it's also used when the phone is locked. It never leaves your iPhone."
        # Recording a walk (off unless the user turns it on) and following a route continue with the screen locked.
        UIBackgroundModes:
          - location
        # Open .gpx files from Files, Mail, AirDrop and other apps.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format (GPX)
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        ITSAppUsesNonExemptEncryption: false
    # Team, bundle ID and API keys come from Config/Base.xcconfig + your private Config/Secrets.xcconfig.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: TopoOffline
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (it still runs on iPad, at iPhone size)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

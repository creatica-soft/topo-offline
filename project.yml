# Generate the Xcode project with:  xcodegen generate
name: TopoOffline
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TopoOffline:
    type: application
    platform: iOS
    sources:
      - path: TopoOffline
    info:
      path: TopoOffline/Info.plist
      properties:
        CFBundleDisplayName: Topo Offline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LINZAPIKey: $(LINZ_API_KEY)
        LINZKeyIsDeveloper: $(LINZ_KEY_IS_DEVELOPER)
        NSLocationWhenInUseUsageDescription: "Your location is shown on the map so you can see where you are, even without phone signal. It never leaves your iPhone."
        ITSAppUsesNonExemptEncryption: false
    # Team, bundle ID and API keys come from Config/Base.xcconfig + your private Config/Secrets.xcconfig.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: TopoOffline
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (it still runs on iPad, at iPhone size)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
